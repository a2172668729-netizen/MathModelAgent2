[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmodelagent"
version = "0.1.0"
description = "Artifact-first foundation for a reproducible mathematical modeling workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "PyMuPDF>=1.24,<2",
  "pypdf>=5,<7",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
mmagent = "mmagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: runs real external scientific or TeX tools",
  "end_to_end: runs the complete Python-to-PDF and reproduction workflow",
]
