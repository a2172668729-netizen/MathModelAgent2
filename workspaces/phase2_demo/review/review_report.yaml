- id: review-synthetic-generalization
  severity: warning
  category: data
  description: All five observations are project-authored synthetic points with the exact relation y = 2x + 1; sample-out validation was not run, so the zero training RMSE cannot support any real-world or competition generalization claim. The current artifacts disclose this limitation and make no such claim.
  evidence_path: data/metadata/observations.yaml
  recommended_action: Keep the synthetic-fixture disclaimer in every derived deliverable and do not generalize the result; use independent real or competition-authorized data and out-of-sample validation for any broader claim.
