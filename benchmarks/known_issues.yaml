schema_version: "1.0"
issues:
  - id: human-visual-acceptance
    classification: known_limitation
    status: open
    scope: all_pdf_cases
    description: 自动渲染、空白页、缺图、乱码和溢出检查不能替代最终人工逐页视觉验收。
    handling: 每次 attempt 保留 paper/preview/all，并将 human_visual_acceptance 作为 warning。
  - id: reviewer-os-sandbox
    classification: known_limitation
    status: open
    scope: reviewer
    description: Reviewer 使用独立进程和落盘产物副本隔离，但不是操作系统级敌对代码沙箱。
    handling: 校验主 workspace 前后文件哈希不变，并保持只写 review 的契约。
  - id: fixture-capability-boundary
    classification: scope_boundary
    status: accepted
    scope: benchmark_dataset
    description: 预编写参考实现只验证明确任务与工程闭环，不能证明任意真实赛题的自主建模能力。
    handling: 文档和报告持续保留 synthetic regression fixture 声明。
