schema_version: "1.0"
id: data_quality_regression
title: 含缺失与异常值的关系建模
description: 故意含模糊条件、缺失值和强异常值的数据审计与稳健回归。
difficulty: hard
tags: [data-quality, missing-values, outliers, ambiguous, regression, smoke]
smoke: true
timeout_seconds: 120
random_seed: 20260711
solver_profile: data_quality
expected_modeling_steps:
  - 统计缺失值并声明插补规则
  - 基于初步残差和 MAD 识别强异常值
  - 在保留审计证据的清洗数据上拟合线性模型
  - 报告清洗行数、斜率和异常数量
hard_checks: [task_completed, python_really_executed, independent_numeric_validation, no_untraceable_results, referenced_files_exist]
numeric_expectations:
  - {path: metrics.missing_count, minimum: 4, maximum: 4}
  - {path: metrics.outlier_count, minimum: 3, maximum: 6}
  - {path: metrics.clean_rows, minimum: 44, maximum: 47}
  - {path: metrics.slope, minimum: 2.9, maximum: 3.1}
structural_expectations:
  required_files: [input/data.csv, outputs/metrics.json, outputs/details.csv, outputs/claims.json, figures/figure_01.png, figures/figure_02.png, tables/table_01.csv, tables/table_02.csv, paper/main.pdf, oracle_validation.json]
  minimum_figures: 2
  minimum_tables: 2
  minimum_pdf_pages: 2
  maximum_pdf_pages: 8
  required_pdf_text: [含缺失与异常值的关系建模, 限制]
prohibited_errors:
  - 静默删除缺失或异常记录而不报告数量
  - 把未核实的异常成因写成确定事实
known_ambiguities:
  - 缺失机制未知，插值只是透明且可复现的基准策略
  - 异常值可能是真实极端观测，不能声称必然是测量错误
